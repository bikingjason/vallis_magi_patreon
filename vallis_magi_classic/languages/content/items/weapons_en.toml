# Ammunition

[items.arrow]
name = "Arrow"
description = "A light missile with a sharpened head, used as ammunition for bows."
usage = "Ammunition for bows. Adds a small amount of damage when fired, but is not normally used as a hand weapon."

[items.bolt]
name = "Bolt"
description = "A short, heavy missile designed to be fired from a crossbow."
usage = "Ammunition for crossbows. Heavier and more damaging than an arrow, but only useful with a crossbow."

[items.rock]
name = "Rock"
description = "A rough stone that can be thrown in desperation or used as a crude weapon."
usage = "A crude thrown weapon and sling stone. Easy to find and usable as ammunition for a sling, but inaccurate and weak by itself."

# Blunt melee weapons

[items.mace]
name = "Mace"
description = "A heavy-headed blunt weapon, simple to use and effective against armour and bone."
usage = "A blunt melee weapon. Less accurate than a blade, but good for delivering strong crushing blows, especially against hard or armoured targets."

# Bladed melee weapons

[items.dagger]
name = "Dagger"
description = "A short, quick blade that is easy to carry and useful at close quarters."
usage = "A bladed melee weapon. Accurate and fast, but with limited reach and lower damage than larger weapons."

[items.long_sword]
name = "Long sword"
description = "A well-balanced blade with good reach, useful for both cutting and thrusting attacks."
usage = "A bladed melee weapon. A reliable all-rounder with good accuracy, damage, and handling."

[items.two_handed_sword]
name = "Two handed sword"
description = "A large, powerful sword that requires both hands, striking with great force but less speed."
usage = "A large bladed melee weapon. Delivers very high damage, but is slower to swing and requires both hands."

# Hafted melee weapons

[items.spear]
name = "Spear"
description = "A long hafted weapon with a sharp point, useful for keeping enemies at a distance."
usage = "A hafted melee weapon. Offers good reach, decent accuracy, and solid damage without being too heavy."

# Ranged weapons

[items.bow]
name = "Bow"
description = "A flexible ranged weapon that fires arrows, allowing attacks from a distance."
usage = "A missile weapon. Allows ranged attacks using arrows, with moderate accuracy, damage, and speed."

[items.crossbow]
name = "Crossbow"
description = "A mechanical bow that fires bolts with force and accuracy, though it is slower to handle."
usage = "A missile weapon. Accurate and powerful at range when loaded with bolts, but slower to fire than a bow."

[items.sling]
name = "Sling"
description = "A simple ranged weapon that hurls stones or bullets with surprising force."
usage = "A missile weapon. Light and simple, using rocks as ammunition, but less damaging than bows or crossbows."

# Thrown weapons

[items.dart]
name = "Dart"
description = "A small thrown missile, light enough to carry in numbers and quick to cast at an enemy."
usage = "A thrown weapon. Accurate, fast, and stackable, but each dart does only light damage."
